# Sviluppo locale: solo PostgreSQL. API e web girano con `npm run dev`.
# Credenziali di sviluppo, allineate a apps/api/.env.example (non usarle in produzione).
name: kikko

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kikko
      POSTGRES_PASSWORD: kikko
      POSTGRES_DB: kikko
      TZ: Europe/Rome
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - kikko-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kikko -d kikko']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kikko-db:
